name: No File Left Behind declaration
description: Checks an app's .nflb.json and says, on the pull request that changes it, what merging will declare.
branding:
  icon: check-square
  color: blue
inputs:
  token:
    description: Used to read the earlier declaration and to comment on the pull request.
    default: ${{ github.token }}
  adopters-token:
    description: Optional. A token that may send a repository_dispatch to no-file-left-behind/adopters, to tell the list at once instead of within the hour.
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/tools/declare.mjs"
      env:
        NFLB_TOKEN: ${{ inputs.token }}
        NFLB_ADOPTERS_TOKEN: ${{ inputs.adopters-token }}
